---
name: Build and Push

on:
  workflow_dispatch:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - .github/workflows/build.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@master
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=,format=long
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Cross
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -sSLf https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz | tar -xzf - -C "$HOME/.cargo/bin"

      - name: Cross compile for multiple platforms
        run: |
          "$HOME/.cargo/bin/cross" build --locked --release --target x86_64-unknown-linux-musl
          mv target/x86_64-unknown-linux-musl/release/cors ./cors-x86_64-unknown-linux-musl
          rm -rf target
          "$HOME/.cargo/bin/cross" build --locked --release --target aarch64-unknown-linux-musl
          mv target/aarch64-unknown-linux-musl/release/cors ./cors-aarch64-unknown-linux-musl
          rm -rf target
          ls -la

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@master

      - name: Login to GHCR
        uses: docker/login-action@master
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Build and push Docker image
        uses: docker/build-push-action@master
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
