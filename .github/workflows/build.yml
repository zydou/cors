---
name: Docker

on:
  workflow_dispatch:
  push:
    paths:
      - main.go
      - Dockerfile
      - .github/workflows/build.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@master
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=,format=long
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Go
        uses: actions/setup-go@main
        with:
          go-version: 1.26

      - name: Cross compile for multiple platforms
        run: |
          # 交叉编译到所有目标平台
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o cors-linux-amd64 main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o cors-linux-arm64 main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm go build -o cors-linux-arm main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=ppc64le go build -o cors-linux-ppc64le main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=s390x go build -o cors-linux-s390x main.go
          # 查看编译结果
          ls -la

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@master

      - name: Login to GHCR
        uses: docker/login-action@master
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Build Docker
        uses: docker/build-push-action@master
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm,linux/ppc64le,linux/s390x
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
