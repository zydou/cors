---
name: Build and Push

on:
  workflow_dispatch:
  push:
    paths:
      - main.go
      - Dockerfile
      - main_test.go
      - go.mod
      - .github/workflows/build.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Set up Go
        uses: actions/setup-go@main
        with:
          go-version: 1.26

      - name: Run tests
        run: go test -v -race -count=1 .

      - name: Vet
        run: go vet .

      - name: Build smoke check
        run: go build -o /dev/null .

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@master
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=,format=long
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Cross compile for multiple platforms
        env:
          CGO_ENABLED: 0
          GOOS: linux
        run: |
          GOARCH=amd64 go build -o cors-linux-amd64 main.go
          GOARCH=arm64 go build -o cors-linux-arm64 main.go
          GOARCH=arm go build -o cors-linux-arm main.go
          GOARCH=ppc64le go build -o cors-linux-ppc64le main.go
          GOARCH=s390x go build -o cors-linux-s390x main.go
          ls -la

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@master

      - name: Login to GHCR
        uses: docker/login-action@master
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Build and push Docker image
        uses: docker/build-push-action@master
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm,linux/ppc64le,linux/s390x
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
