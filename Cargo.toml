[package]
name = "cors"
version = "2.0.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1.54", features = ["full"] }
tower-http = { version = "0.7", features = ["cors"] }
bytes = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "brotli", "deflate", "stream", "socks", "cookies"] }
futures-core = "0.3"
http-body = "1.1"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = true

[[bin]]
name = "cors"
path = "src/main.rs"
